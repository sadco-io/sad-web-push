[package]
name = "sad-web-push"
description = "Web push notification client with pure-Rust HTTP-ECE encryption, VAPID authentication, and modern HTTP/TLS transports: a maintained fork of web-push."
version = "0.12.0"
authors = [
    "Sadco Security Team",
    "Julius de Bruijn <julius+github@nauk.io>",
    "Andrew Ealovega <Andrew@Ealovega.dev>",
]
license = "Apache-2.0"
repository = "https://github.com/sadco-io/sad-web-push"
documentation = "https://docs.rs/sad-web-push/"
readme = "README.md"
keywords = ["web-push", "http-ece", "vapid"]
categories = ["web-programming", "asynchronous"]
include = [
    "Cargo.toml",
    "LICENSE",
    "NOTICE",
    "SECURITY.md",
    "CHANGELOG.md",
    "README.md",
    "src/**",
    "resources/**",
]
rust-version = "1.89.0"
edition = "2021"

[features]
default = ["hyper-client"]
hyper-client = [
    "dep:bytes",
    "dep:http-body-util",
    "dep:hyper",
    "dep:hyper-rustls",
    "dep:hyper-util",
    "dep:log",
    "dep:rustls",
    "dep:tokio",
    "dep:tower-service",
]
hyper-native-tls = [
    "dep:bytes",
    "dep:http-body-util",
    "dep:hyper",
    "dep:hyper-tls",
    "dep:hyper-util",
    "dep:log",
    "dep:native-tls",
    "dep:tokio",
    "dep:tokio-native-tls",
    "dep:tower-service",
]
isahc-client = [
    "dep:futures-lite",
    "dep:isahc",
    "dep:log",
]

[dependencies]
aes-gcm = { version = "0.11", features = ["zeroize"] }
async-trait = "0.1"
bytes = { version = "1", optional = true }
ct-codecs = "1.1.3"
futures-lite = { version = "2.5", default-features = false, features = ["std"], optional = true }
getrandom = "0.4"
hkdf = "0.13"
http = "1"
http-body-util = { version = "0.1", optional = true }
httpdate = "1.0"
hyper = { version = "1", features = ["client", "http1", "http2"], optional = true }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "rustls-native-certs", "tls12"], optional = true }
hyper-tls = { version = "0.6", optional = true }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "tokio"], optional = true }
isahc = { version = "2", default-features = false, features = ["native-tls", "http2", "static-curl", "text-decoding"], optional = true }
log = { version = "0.4", optional = true }
native-tls = { version = "0.2", optional = true }
p256 = { version = "0.14", features = ["ecdh", "ecdsa", "pkcs8", "pem"] }
pem-rfc7468 = { version = "1.0", features = ["alloc"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tokio = { version = "1", default-features = false, features = ["net", "rt", "time"], optional = true }
tokio-native-tls = { version = "0.3", optional = true }
tower-service = { version = "0.3", optional = true }
zeroize = { version = "1.8", features = ["derive"] }

[dev-dependencies]
regex = "1.5"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
