[package]
name = "sad-web-push"
description = "Web push notification client with support for pure-Rust http-ece encryption and VAPID authentication: a maintained, API-compatible fork of web-push."
version = "0.11.1"
authors = [
    "Sadco Security Team",
    "Julius de Bruijn <julius+github@nauk.io>",
    "Andrew Ealovega <Andrew@Ealovega.dev>",
]
license = "Apache-2.0"
repository = "https://github.com/sadco-io/sad-web-push"
documentation = "https://docs.rs/sad-web-push/"
readme = "README.md"
keywords = ["web-push", "http-ece", "vapid"]
categories = ["web-programming", "asynchronous"]
include = [
    "Cargo.toml",
    "LICENSE",
    "NOTICE",
    "SECURITY.md",
    "CHANGELOG.md",
    "README.md",
    "src/**",
    "resources/**",
]
rust-version = "1.89.0"
edition = "2021"

[features]
default = ["isahc-client"]
isahc-client = ["isahc", "futures-lite/futures-io", "dep:log"]
hyper-client = ["hyper", "hyper-tls", "dep:tokio", "dep:log"]

[dependencies]
aes-gcm = { version = "0.11", features = ["zeroize"] }
async-trait = "0.1"
ct-codecs = "1.1.3"
futures-lite = { version = "2.5.0", optional = true }
getrandom = "0.4"
hkdf = "0.13"
http = "0.2"
httpdate = "1.0"
hyper = { version = "0.14", features = ["client", "http1"], optional = true }
hyper-tls = { version = "0.5", optional = true }
isahc = { version = "1.4.0", optional = true }
log = { version = "0.4", optional = true }
p256 = { version = "0.14", features = ["ecdh", "ecdsa", "pkcs8", "pem"] }
pem-rfc7468 = { version = "1.0", features = ["alloc"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tokio = { version = "1", default-features = false, features = ["time"], optional = true }
zeroize = { version = "1.8", features = ["derive"] }

[dev-dependencies]
regex = "1.5"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
